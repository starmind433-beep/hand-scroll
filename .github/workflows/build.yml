name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: |
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip || curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o gradle.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
          unzip -q gradle.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Download hand tracking model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o app/src/main/assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HandScroll-APK
          path: app/build/outputs/apk/debug/*.apk
